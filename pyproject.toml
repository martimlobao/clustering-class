[project]
name = "clustering-class"
version = "0.1.0"
description = "Clustering class"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Martim Lobao", email = "dev@lobao.io" }]
dependencies = [
  "jupyter>=1.1.1",
  "matplotlib>=3.11.0",
  "numpy>=2.5.0",
  "pandas>=3.0.3",
  "pydantic-settings>=2.14.1",
  "scikit-learn>=1.9.0",
  "scipy>=1.17.1",
  "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "coverage>=7.14.1",
  "docformatter>=1.7.7",
  "httpx>=0.27.2",
  "hypothesis>=6.155.5",
  "ipykernel>=7.3.0",
  "ipython>=9.14.1",
  "pyright>=1.1.410",
  "pytest>=9.1.1",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.21",
  "rumdl>=0.2.30",
  "tombi>=1.2.0",
  "ty>=0.0.56",
  "yamllint>=1.37.1",
]

[tool.pyright]
include = ["notebooks", "tests"]
typeCheckingMode = "strict"
executionEnvironments = [
  { root = "notebooks", extraPaths = ["notebooks", "."] },
  { root = "tests", extraPaths = ["notebooks", "."], reportPrivateUsage = false },
]

[tool.pytest]
addopts = ["--cov-fail-under=0", "--cov=notebooks"]
testpaths = [
  "tests",
]
